<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Practice</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2028;
      --text: #e8e8e8;
      --text-dim: #9ca3af;
      --primary: #10b981;
      --primary-bright: #22c55e;
      --error: #f87171;
      --border: #2d3748;
      --pos-noun: #60a5fa;
      --pos-verb: #10b981;
      --pos-adjective: #f59e0b;
      --pos-adverb: #a78bfa;
      --pos-pronoun: #22d3ee;
      --pos-auxiliary: #f472b6;
      --pos-other: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #app { max-width: 720px; margin: 0 auto; width: 100%; }
    button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.15s;
    }
    button:hover { border-color: var(--primary); }
    button:active { transform: scale(0.98); }
    button.primary { background: var(--primary); border-color: var(--primary); color: #000; }
    input[type="text"] {
      width: 100%;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 1.1rem;
      font-family: inherit;
    }
    input[type="text"]:focus { outline: none; border-color: var(--primary); }
    input.slot-input {
      width: 110px;
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--border);
      border-radius: 0;
      padding: 10px 4px;
      font-size: 1.05rem;
    }
    .scene { text-align: center; margin: 24px 0; }
    .emoji { font-size: 3.5rem; }
    .scene-desc { color: var(--text-dim); margin-top: 6px; }
    .chinese {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 16px;
    }
    .word-slots {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 12px;
      font-size: 1.1rem;
    }
    .slot-input {
      flex: 0 0 auto;
      width: 110px;
      padding: 10px 4px;
      background: transparent;
      color: var(--text);
      border: none;
      border-bottom: 2px solid var(--border);
      text-align: center;
      font-family: "Times New Roman", Georgia, serif;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
      transition: border-color 0.15s, color 0.15s;
      border-radius: 0;
    }
    .slot-input:focus {
      outline: none;
      border-bottom-color: var(--primary);
      border-bottom-width: 2px;
    }
    .slot-input:disabled {
      cursor: not-allowed;
    }
    .slot-input::placeholder {
      color: var(--text-dim);
      opacity: 0.4;
      letter-spacing: 2px;
    }
    .slot-pending {
      color: var(--text-dim);
    }
    .slot-correct {
      color: var(--primary-bright);
      border-bottom-color: var(--primary-bright);
    }
    .slot-incorrect {
      color: var(--error);
      border-bottom-color: var(--error);
    }
    .slot-revealed {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    @keyframes slot-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .slot-input.shake {
      animation: slot-shake 0.4s ease-in-out;
      border-bottom-color: var(--error) !important;
      color: var(--error) !important;
    }
    .answer-feedback { margin: 16px 0; padding: 12px; border-radius: 6px; background: var(--surface); }
    .answer-feedback.bad { border-left: 3px solid var(--error); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .analysis-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .badge-ok { color: var(--primary-bright); font-weight: 600; }
    .english-large {
      font-size: 1.8rem;
      color: var(--primary);
      text-align: center;
      margin: 16px 0 24px;
    }
    .word-table-wrapper { overflow-x: auto; margin-bottom: 20px; }
    .word-table { width: 100%; border-collapse: collapse; min-width: 400px; }
    .word-table th, .word-table td {
      padding: 8px 12px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .word-table thead th { font-size: 1.1rem; padding-bottom: 12px; border-bottom: 2px solid var(--primary); }
    .word-table .phonetic { color: var(--text-dim); font-style: italic; font-family: "Times New Roman", serif; }
    .word-table .role { color: var(--text-dim); font-size: 0.9rem; }
    .pos-noun { color: var(--pos-noun); }
    .pos-verb { color: var(--pos-verb); }
    .pos-adjective { color: var(--pos-adjective); }
    .pos-adverb { color: var(--pos-adverb); }
    .pos-pronoun { color: var(--pos-pronoun); }
    .pos-auxiliary { color: var(--pos-auxiliary); }
    .pos-preposition, .pos-conjunction, .pos-article, .pos-particle { color: var(--pos-other); }
    .usage, .examples, .similar {
      background: var(--surface);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .usage h3, .examples h3, .similar h3 { font-size: 1rem; margin-bottom: 8px; color: var(--primary); }
    .example { margin-bottom: 12px; }
    .example:last-child { margin-bottom: 0; }
    .ex-en { font-size: 1.05rem; }
    .ex-cn { color: var(--text-dim); margin-top: 4px; }
    .similar ul { list-style: none; padding: 0; }
    .similar li { padding: 6px 0; border-bottom: 1px solid var(--border); }
    .similar li:last-child { border-bottom: none; }
    .sim-cn { display: block; color: var(--text-dim); margin-top: 2px; font-size: 0.9rem; }
    @media (max-width: 600px) {
      body { padding: 12px; }
      .chinese { font-size: 1.3rem; }
      .english-large { font-size: 1.5rem; }
      .emoji { font-size: 3rem; }
      .word-table { min-width: 320px; }
      .actions { flex-wrap: wrap; }
      .actions button { flex: 1; min-width: 120px; }
      .slot-input { width: 80px; font-size: 1rem; padding: 8px 6px; }
    }
  </style>
</head>

":"介绍家庭日常家务安排时的常用说法。","similar":[{"english":"I do the dishes every day.","chinese":"我每天洗碗。"}],"examples":[{"english":"I usually do laundry every Sunday morning.","chinese":"我通常每个星期天早上洗衣服。"}]},{"id":119,"category":"daily_life","scene_emoji":"🙇","scene_desc":"道歉","chinese":"抱歉,我迟到了。","english":"Sorry, I am late.","hints":["抱歉 Sorry","我 I","是 am","迟到 late"],"difficulty":"beginner","words":[{"text":"Sorry","phonetic":"/ˈsɒri/","pos":"adjective","pos_zh":"形容词","meaning_zh":"抱歉","role_zh":"状语"},{"text":"I","phonetic":"/aɪ/","pos":"pronoun","pos_zh":"代词","meaning_zh":"我","role_zh":"主语"},{"text":"am","phonetic":"/æm/","pos":"auxiliary","pos_zh":"系动词","meaning_zh":"是","role_zh":"谓语"},{"text":"late","phonetic":"/leɪt/","pos":"adjective","pos_zh":"形容词","meaning_zh":"迟到","role_zh":"表语"}],"usage_context":"因迟到向他人道歉的简短表达。","similar":[{"english":"I'm sorry I'm late.","chinese":"对不起我迟到了。"}],"examples":[{"english":"Sorry, I am late for the meeting.","chinese":"抱歉,我开会迟到了。"}]},{"id":120,"category":"daily_life","scene_emoji":"👋","scene_desc":"问候","chinese":"你今天过得怎么样?","english":"How was your day?","hints":["怎样 How","是 was","你的 your","日子 day"],"difficulty":"beginner","words":[{"text":"How","phonetic":"/haʊ/","pos":"adverb","pos_zh":"副词","meaning_zh":"怎样","role_zh":"状语"},{"text":"was","phonetic":"/wɒz/","pos":"auxiliary","pos_zh":"系动词","meaning_zh":"是","role_zh":"谓语"},{"text":"your","phonetic":"/jɔːr/","pos":"pronoun","pos_zh":"代词","meaning_zh":"你的","role_zh":"定语"},{"text":"day","phonetic":"/deɪ/","pos":"noun","pos_zh":"名词","meaning_zh":"一天","role_zh":"主语"}],"usage_context":"见面或打电话时关心对方一天的日常问候。","similar":[{"english":"How is your day going?","chinese":"你今天过得如何?"}],"examples":[{"english":"Hi! How was your day?","chinese":"嗨!你今天过得怎么样?"}]}]

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

  <script>
    const QUESTIONS = JSON.parse(
      document.getElementById('questions-data').textContent
    )

    function normalize(s) {
      return s
        .toLowerCase()
        .trim()
        .replace(/[.,!?;:'"]/g, '')
        .replace(/\s+/g, ' ')
    }

    const { createApp, ref, computed } = Vue

    createApp({
      setup() {
        const slotInputs = ref([])
        const revealed = ref(false)
        const lastResult = ref(null)
        const showAnalysis = ref(false)

        const currentIndex = ref(0)
        const current = computed(() => QUESTIONS[currentIndex.value] || QUESTIONS[0])

        const userAnswer = computed(() =>
          slotInputs.value.map(s => s.trim()).filter(Boolean).join(' ')
        )

        function resetSlots() {
          const expected = current.value.english
            .replace(/[.,!?;:'"]/g, '')
            .split(/\s+/)
            .filter(Boolean)
          slotInputs.value = expected.map(() => '')
          Vue.nextTick(() => {
            const first = document.querySelector('.slot-input')
            if (first) first.focus()
          })
        }
        resetSlots()

        const isCorrect = computed(() =>
          userAnswer.value.trim().length > 0 &&
          normalize(userAnswer.value) === normalize(current.value.english)
        )

        const wordSlots = computed(() => {
          const expected = current.value.english
            .replace(/[.,!?;:'"]/g, '')
            .split(/\s+/)
            .filter(Boolean)
          const typed = userAnswer.value
            .replace(/[.,!?;:'"]/g, '')
            .split(/\s+/)
            .filter(Boolean)
          return expected.map((word, i) => {
            const t = typed[i]
            return {
              expected: word,
              typed: t || '',
              isCorrect: !!t && normalize(t) === normalize(word),
            }
          })
        })

        function advance() {
          revealed.value = false
          lastResult.value = null
          currentIndex.value = (currentIndex.value + 1) % QUESTIONS.length
          resetSlots()
        }

        function next() {
          // No answer typed — just skip.
          if (userAnswer.value.trim().length === 0) {
            advance()
            return
          }
          if (isCorrect.value) {
            // User fixed it after seeing the answer → just advance
            // (they've already seen the correct answer, no need for analysis view).
            // Otherwise, first-time correct → analysis view.
            if (revealed.value) {
              advance()
            } else {
              showAnalysis.value = true
            }
            return
          }
          // Wrong: first time → reveal the answer.
          // If already revealed (user pressed Enter again while still wrong),
          // do nothing — let them keep editing.
          if (!revealed.value) {
            revealed.value = true
          }
        }

        function exitAnalysis() {
          showAnalysis.value = false
          revealed.value = false
          resetSlots()
          lastResult.value = null
          currentIndex.value = (currentIndex.value + 1) % QUESTIONS.length
        }

        function onSlotInput(i, e) {
          // Strip spaces and punctuation from individual slot input (each slot = one word)
          const cleaned = e.target.value.replace(/[\s.,!?;:'"]/g, '')
          if (cleaned !== e.target.value) {
            slotInputs.value[i] = cleaned
          }
          // No auto-jump on correct: user explicitly presses Space to commit/advance.
        }

        function onSlotSpace(i) {
          // Space = "commit and advance".
          // - Empty slot: advance to next.
          // - Correct word: advance to next.
          // - Wrong word: shake the bottom-border (underline), stay on current.
          // - On last slot: submit the question.
          const inputs = document.querySelectorAll('.slot-input')
          const v = slotInputs.value[i] || ''
          const expected = (current.value.english
            .replace(/[.,!?;:'"]/g, '')
            .split(/\s+/)[i]) || ''

          const isCorrect = !v || normalize(v) === normalize(expected)
          if (!isCorrect) {
            triggerShake(i)
            return
          }
          // Correct (or empty) - advance.
          if (i + 1 < inputs.length) {
            inputs[i + 1].focus()
          } else {
            next()
          }
        }

        function triggerShake(i) {
          const inputs = document.querySelectorAll('.slot-input')
          const input = inputs[i]
          if (!input) return
          input.classList.remove('shake')
          // Force reflow so the animation can restart.
          void input.offsetWidth
          input.classList.add('shake')
          setTimeout(() => input.classList.remove('shake'), 450)
        }

        function focusNextSlot(i) {
          const inputs = document.querySelectorAll('.slot-input')
          const next = inputs[i + 1]
          if (next) next.focus()
        }

        function onBackspace(i, e) {
          if (!slotInputs.value[i] && i > 0) {
            e.preventDefault()
            const inputs = document.querySelectorAll('.slot-input')
            const prev = inputs[i - 1]
            if (prev) {
              prev.focus()
              // Move cursor to end
              const len = prev.value.length
              prev.setSelectionRange(len, len)
            }
          }
        }

        function handleKeydown(e) {
          if (e.target.tagName === 'INPUT') return
          if (showAnalysis.value) {
            if (e.key === 'Escape' || e.key === 'Enter') {
              e.preventDefault()
              exitAnalysis()
            }
            return
          }
          if (e.key === 'Enter') {
            e.preventDefault()
            next()
          }
        }

        window.addEventListener('keydown', handleKeydown)

        return {
          current,
          slotInputs,
          userAnswer,
          revealed,
          showAnalysis,
          isCorrect,
          wordSlots,
          next,
          advance,
          exitAnalysis,
          resetSlots,
          onSlotInput,
          onSlotSpace,
          triggerShake,
          focusNextSlot,
          onBackspace,
        }
      },
      template: `
        <div>
          <!-- Practice View -->
          <section v-if="!showAnalysis">
            <div class="scene">
              <div class="emoji">{{ current.scene_emoji }}</div>
              <div class="scene-desc">{{ current.scene_desc }}</div>
            </div>

            <div class="chinese">{{ current.chinese }}</div>

            <div class="word-slots">
              <input
                v-for="(slot, i) in wordSlots"
                :key="i"
                type="text"
                v-model="slotInputs[i]"
                class="slot-input"
                :class="{
                  'slot-correct': slot.typed && slot.isCorrect,
                  'slot-incorrect': slot.typed && !slot.isCorrect,
                  'slot-pending': !slot.typed,
                  'slot-revealed': revealed
                }"
                :placeholder="revealed ? slot.expected : '_'"
                @keydown.space.prevent="onSlotSpace(i)"
                @keydown.tab.prevent
                @keydown.enter.prevent="next"
                @input="onSlotInput(i, $event)"
                @keydown.backspace="onBackspace(i, $event)"
              />
            </div>

            <div v-if="revealed && !isCorrect && userAnswer.length > 0" class="answer-feedback bad">
              <p>� 答案是: <strong>{{ current.english }}</strong></p>
            </div>
          </section>

          <!-- Analysis View -->
          <section v-else class="analysis">
            <div class="analysis-header">
              <button @click="exitAnalysis">← 返回</button>
              <span class="badge-ok">✓ 答对了！</span>
            </div>

            <h2 class="english-large">{{ current.english }}</h2>

            <div class="word-table-wrapper">
              <table class="word-table">
                <thead>
                  <tr>
                    <th v-for="(w, i) in current.words" :key="i" :class="'pos-' + w.pos">{{ w.text }}</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td v-for="(w, i) in current.words" :key="'p' + i" class="phonetic">{{ w.phonetic }}</td>
                  </tr>
                  <tr>
                    <td v-for="(w, i) in current.words" :key="'pos' + i" :class="'pos-' + w.pos">{{ w.pos_zh }}</td>
                  </tr>
                  <tr>
                    <td v-for="(w, i) in current.words" :key="'m' + i">{{ w.meaning_zh }}</td>
                  </tr>
                  <tr>
                    <td v-for="(w, i) in current.words" :key="'r' + i" class="role">{{ w.role_zh }}</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="usage">
              <h3>💡 适用场景</h3>
              <p>{{ current.usage_context }}</p>
            </div>

            <div class="examples">
              <h3>💬 示例</h3>
              <div v-for="(ex, i) in current.examples" :key="i" class="example">
                <p class="ex-en">{{ ex.english }}</p>
                <p class="ex-cn">{{ ex.chinese }}</p>
              </div>
            </div>

            <div class="similar">
              <h3>📝 相似句式</h3>
              <ul>
                <li v-for="(s, i) in current.similar" :key="i">
                  <span class="sim-en">{{ s.english }}</span>
                  <span class="sim-cn">{{ s.chinese }}</span>
                </li>
              </ul>
            </div>

            <div class="actions">
              <button class="primary" @click="exitAnalysis">下一题 →</button>
            </div>
          </section>
        </div>
      `
    }).mount('#app')
  </script>
</body>
</html>
